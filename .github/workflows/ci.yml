name: CI

on:
  pull_request:
  push:
    branches: [snapshot, stable, prod]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instal·la dependències
        run: npm ci

      - name: Lint
        if: matrix.check == 'lint'
        run: npm run lint

      - name: Typecheck
        if: matrix.check == 'typecheck'
        run: npm run typecheck

      - name: Tests amb cobertura
        id: tests
        if: matrix.check == 'tests'
        run: npm run test --workspace apps/mobile -- --ci --coverage --runInBand

      - name: Desa la cobertura
        if: ${{ !cancelled() && matrix.check == 'tests' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/
          if-no-files-found: error
          retention-days: 7

      # Activació i credencials: docs/ci.md. Les PR de forks no tenen secrets.
      - name: Prepara SonarCloud
        id: sonar_config
        if: >-
          matrix.check == 'tests' && vars.SONAR_ENABLED == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          for variable in SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
            if [ -z "${!variable}" ]; then
              echo "::error::Falta configurar $variable a GitHub Actions. Consulta docs/ci.md."
              exit 1
            fi
          done
          test -s apps/mobile/coverage/lcov.info
          # Jest escriu rutes relatives a apps/mobile; Sonar analitza des de l'arrel.
          sed 's|^SF:src/|SF:apps/mobile/src/|' apps/mobile/coverage/lcov.info > apps/mobile/coverage/lcov-sonar.info

      - name: Anàlisi SonarCloud i Quality Gate
        if: steps.sonar_config.outcome == 'success'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
